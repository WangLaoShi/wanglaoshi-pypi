# Install package, run quick/business/submission tests across Python versions.
name: Python package

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    # 钉住 24.04：ubuntu-latest 已迁到 26.04，setup-python 暂无 3.9 构建
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 核心 + pytest/flake8；分层说明见 docs/DEPENDENCIES.md
        python -m pip install -e ".[dev]"
    - name: Lint with flake8
      run: |
        flake8 wanglaoshi tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 wanglaoshi tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest (quick + release)
      run: |
        python -m pytest -m "quick or submission or release" tests/ -q
