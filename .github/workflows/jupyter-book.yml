# 构建 Jupyter Book 并发布到 GitHub Pages (gh-pages)
name: Jupyter Book

on:
  # 每次推 master 都重建 Pages，避免「改了包/文档但站点还是旧的」
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + Jupyter Book
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[book]"

      - name: Build book
        run: python scripts/build_book.py

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: book/_build/html
          force_orphan: true
          enable_jekyll: false
