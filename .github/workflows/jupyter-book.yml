# 构建 Jupyter Book 并发布到 GitHub Pages (gh-pages)
name: Jupyter Book

on:
  push:
    branches: ["master"]
    paths:
      - "book/**"
      - "examples/advanced/**"
      - "examples/business_pipeline_course.ipynb"
      - "binder/**"
      - "docs/**"
      - "scripts/prepare_book.py"
      - "scripts/build_book.py"
      - "setup.py"
      - ".github/workflows/jupyter-book.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + Jupyter Book
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[book]"

      - name: Build book
        run: python scripts/build_book.py

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: book/_build/html
          force_orphan: true
          enable_jekyll: false
