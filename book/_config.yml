# Jupyter Book 配置 —— 基线工坊（产品名）；包名仍为 wanglaoshi
# 构建：python scripts/build_book.py
# 说明：book/README.md 与 docs/DEPENDENCIES.md

title: 基线工坊 · 从 EDA 到提交
author: WangLaoShi
copyright: "2026"
logo: ""

exclude_patterns:
  - README.md
  - _build
  - Thumbs.db
  - .DS_Store
  - "**.ipynb_checkpoints"

execute:
  # 公开站点默认不重跑 Notebook（证据已在 docs/evidence/）
  # 本地若要强制执行：改成 "force" 或构建时传参
  execute_notebooks: "off"
  timeout: 120

parse:
  myst_enable_extensions:
    - colon_fence
    - deflist
    - dollarmath
    - html_image
    - linkify
    - substitution
  myst_url_schemes: [http, https, mailto]

html:
  favicon: ""
  use_edit_page_button: true
  use_repository_button: true
  use_issues_button: true
  home_page_in_navbar: true
  baseurl: ""
  extra_navbar: ""
  extra_footer: |
    <p>基线工坊 · 从 EDA 到提交 · 包名 <code>wanglaoshi</code>（仓库 wanglaoshi-pypi）·
    API 说明书见仓库 <code>docs/API_REFERENCE.md</code></p>
  announcement: "本站教的就是 pip 包 wanglaoshi（仓库 WangLaoShi/wanglaoshi-pypi）。先精讲课，再案例；版面已加宽，手机可横滑代码。"

repository:
  url: https://github.com/WangLaoShi/wanglaoshi-pypi
  path_to_book: book
  branch: master

launch_buttons:
  notebook_interface: jupyterlab
  binderhub_url: "https://mybinder.org"
  thebe: false

sphinx:
  config:
    language: zh_CN
    html_show_copyright: true
    nb_execution_show_tb: true
    html_static_path:
      - _static
    html_css_files:
      - custom.css
    html_theme_options:
      # 放宽主题默认页宽（与 _static/custom.css 双保险）
      show_toc_level: 2
      navigation_with_keys: true
    suppress_warnings:
      - myst.domains
      - mystnb.unknown_mime_type
